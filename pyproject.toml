[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "zeroconf.*",
    "slowapi.*",
    "twilio.*",
    "celery.*",
    "magic.*",
    "bleach.*",
    "azure.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.main",
    "app.rutas.mobile_api_ruta",
    "app.rutas.users_ruta",
    "app.rutas.audit_ruta",
    "app.rutas.ticket_ruta",
    "app.rutas.upload_ruta",
    "app.rutas.auth_ruta",
    "app.rutas.configuracion_ruta",
    "app.servicios.security_detection_service",
    "app.servicios.auth_service",
    "app.servicios.cita_service",
    "app.servicios.user_service",
    "app.servicios.vehiculo_service",
    "app.modelos.user",
    "app.modelos.token_blacklist",
    "app.modelos.audit_log",
    "app.modelos.role",
    "app.modelos.password_reset_token",
    "app.seguridad.token_manager",
    "app.esquemas.user_schema",
    "app.utils.pdf_economia",
    "app.utils.exceptions",
    "app.modelos.app_config",
]
ignore_errors = true
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    ".hypothesis",
    "tests",  # Exclude tests from linting
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file (intentional for app initialization)
    "B904",  # exception chaining (would require significant refactoring)
    "E712",  # comparison to True/False (SQLAlchemy filter patterns)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"app/modelos/*.py" = ["ARG002"]  # Allow unused method arguments in models
"app/rutas/*.py" = ["B008", "ARG001"]  # Allow FastAPI Depends() in defaults and unused request args for rate limiting
"app/utils/pdf_*.py" = ["F841"]  # Allow unused variables in PDF generation (style definitions)
"app/main.py" = ["ARG001", "F821"]  # Allow unused request args in exception handlers and list comprehension variable
"app/tasks/*.py" = ["ARG001"]  # Allow unused self in Celery tasks

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
