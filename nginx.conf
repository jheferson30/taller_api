events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Tamaño máximo de upload (fotos, PDFs)
    client_max_body_size 15M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name _;

        # Proxy todo al backend
        location / {
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Archivos subidos — servir directo desde volumen
        location /uploads/ {
            alias /app/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Logo del taller — caché más corto para permitir actualizaciones
        location /uploads/logo/ {
            alias /app/uploads/logo/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }
    }
}
